name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: go test -timeout 180s ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test (race)
        run: go test -race -timeout 240s ./...

  fuzz:
    name: fuzz token parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fuzz
        run: go test ./internal/token/ -run x -fuzz FuzzDecode -fuzztime 60s

  lint:
    name: gofmt + cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Cross-compile matrix (CGO-free)
        run: ./scripts/build.sh

  scan:
    name: euprovguard scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download euprovguard
        run: |
          curl -sL https://github.com/fabricatorsltd/euprovguard/releases/download/v1.1.0/euprovguard-linux-amd64 -o euprovguard
          chmod +x euprovguard
      - name: Scan
        run: |
          ./euprovguard -path . -bundle compliance-report > scan.log 2>&1
          cat scan.log
      - name: Check for CVEs
        run: |
          if grep -q "CVEs: [1-9]" scan.log; then
            echo "::error::CVEs found by euprovguard"
            exit 1
          fi
      - name: Upload compliance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: compliance-report.*
