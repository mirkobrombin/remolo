<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remolo terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #terminal {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<script>
(function () {
  "use strict";

  var term = new Terminal({
    cursorBlink: true,
    fontFamily: "monospace",
    fontSize: 14,
    convertEol: false
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));
  fit.fit();

  // Decode a base64 string into a Uint8Array of raw terminal bytes.
  function b64ToBytes(b64) {
    var bin = atob(b64);
    var len = bin.length;
    var out = new Uint8Array(len);
    for (var i = 0; i < len; i++) {
      out[i] = bin.charCodeAt(i);
    }
    return out;
  }

  // Encode raw string keystrokes into bytes for POSTing to /input.
  function strToBytes(s) {
    // xterm onData gives a JS string; encode as UTF-8.
    return new TextEncoder().encode(s);
  }

  function postResize() {
    var dims = { cols: term.cols, rows: term.rows };
    fetch("/resize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dims)
    }).catch(function () {});
  }

  // Stream terminal output from the remote PTY via Server-Sent Events.
  var es = new EventSource("/output?cols=" + term.cols + "&rows=" + term.rows);
  es.onmessage = function (ev) {
    if (!ev.data) {
      return;
    }
    term.write(b64ToBytes(ev.data));
  };
  es.onerror = function () {
    // The stream ended (remote exit or connection drop). Show a notice once.
    if (es.readyState === EventSource.CLOSED) {
      term.write("\r\n[remolo: session ended]\r\n");
    }
  };

  // Forward keystrokes to the remote PTY.
  term.onData(function (d) {
    fetch("/input", {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: strToBytes(d)
    }).catch(function () {});
  });

  // Keep the remote window size in sync with the browser.
  term.onResize(function () {
    postResize();
  });

  function refit() {
    fit.fit();
  }
  window.addEventListener("resize", refit);

  term.focus();
})();
</script>
</body>
</html>
